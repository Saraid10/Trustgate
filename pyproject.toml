[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-payment-safety-testbed"
version = "0.1.0"
description = "A local MCP payment-safety testbed for adversarial workflow evaluation."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.13,<2.0",
    "fastapi>=0.115,<1.0",
    "httpx>=0.27,<1.0",
    "mcp[cli]>=1.0,<2.0",
    "psycopg[binary]>=3.2,<4.0",
    "pydantic>=2.8,<3.0",
    "python-dotenv>=1.0,<2.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
    "hypothesis>=6.100,<7.0",
    "mypy>=1.10,<2.0",
    "pre-commit>=3.7,<5.0",
    "pytest>=8.2,<9.0",
    "pytest-asyncio>=0.23,<2.0",
    "ruff>=0.5,<1.0",
    "testcontainers[postgres]>=4.7,<5.0",
]

[tool.setuptools.packages.find]
include = [
    "api*",
    "models*",
    "schemas*",
    "state_machine*",
    "policy_engine*",
    "mock_provider*",
    "mcp_server*",
    "scenarios*",
    "console*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]
ignore = [
    "S101",
]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["api", "models", "schemas", "state_machine", "policy_engine", "mock_provider", "mcp_server"]
